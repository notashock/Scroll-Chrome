<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="dot"></span>
      <span class="title">TubeDeck</span>
    </div>
    <span class="version">v0.4.0</span>
  </div>

  <div class="list">
    <label class="row">
      <div class="item-info">
        <span class="label">Split scrolling</span>
        <span class="sublabel">Dual independent columns</span>
      </div>
      <input type="checkbox" id="enabled" checked>
      <span class="switch"></span>
    </label>

    <label class="row">
      <div class="item-info">
        <span class="label">Hide Shorts</span>
        <span class="sublabel">Clean feeds & suggestions</span>
      </div>
      <input type="checkbox" id="hideShorts" checked>
      <span class="switch"></span>
    </label>

    <label class="row">
      <div class="item-info">
        <span class="label">Ambient glow &amp; glass UI</span>
        <span class="sublabel">Window-wide glow, see-through header &amp; cards</span>
      </div>
      <input type="checkbox" id="fullAmbient">
      <span class="switch"></span>
    </label>

    <!-- Auto-PiP toggles (shown in every browser) -->
    <div id="nonNativePipContainer" style="display: none;">
      <label class="row">
        <div class="item-info">
          <span class="label">Auto PiP</span>
          <span class="sublabel">Float video on tab / window switch</span>
        </div>
        <input type="checkbox" id="autoPip">
        <span class="switch"></span>
      </label>

      <label class="row" id="pipOnMinimizeRow">
        <div class="item-info">
          <span class="label">PiP on window minimize</span>
          <span class="sublabel">Float when browser is minimized</span>
        </div>
        <input type="checkbox" id="pipOnMinimize" checked>
        <span class="switch"></span>
      </label>
    </div>

    <!-- Helium & Chromium Native Auto-PiP Guide Card -->
    <div id="nativePipContainer" class="native-pip-card" style="display: none;">
      <div class="native-card-header">
        <span class="native-title">Auto Picture-in-Picture</span>
        <span class="native-badge">Built-in</span>
      </div>
      <div class="native-card-desc">
        Helium & Chromium natively float YouTube when switching tabs or minimizing. Required setup:
      </div>
      <div class="native-steps">
        <div class="native-step-row">
          <span class="native-step-num">1</span>
          <span class="native-step-text">Browser flag:</span>
          <a href="#" id="openFlagLink" class="native-link" title="Open native flags for Auto-PiP">Flags ↗</a>
        </div>
        <div class="native-step-row">
          <span class="native-step-num">2</span>
          <span class="native-step-text">Site permission:</span>
          <a href="#" id="openPermLink" class="native-link" title="Set Automatic picture-in-picture to Allow for YouTube">Allow PiP ↗</a>
        </div>
      </div>
    </div>

    <div id="statusBanner" class="status-banner"></div>
  </div>

  <div class="footer">
    <div class="shortcut-tip">
      <span class="tip-label">PiP:</span>
      <kbd>Ctrl+Shift+8</kbd>
      <span class="tip-sep">or</span>
      <kbd>Alt+P</kbd>
    </div>
    <a href="#" id="openShortcutsLink" class="shortcuts-link" title="Customize global shortcuts in Chrome">Customize in Chrome ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
